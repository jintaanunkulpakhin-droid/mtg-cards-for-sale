<title>MTG Cards for Sale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: same binder index as the collection page: sticky search, filters, card rows; tap a row for the card text, tick cards to build a list to send the seller. */
:root{
  --bg:#eef1f4;--panel:#fff;--ink:#17212c;--muted:#5a6775;--line:#d3dae1;--accent:#17607f;--accent-ink:#fff;
  --good:#17693d;--good-bg:#dff3e6;--warn:#7a5700;--warn-bg:#fbefcd;--need:#9a2f2f;--need-bg:#fbe4e2;
  --w:#f4eeca;--u:#7fb6dd;--b:#6d6570;--r:#df7f62;--g:#74b085;--c:#c5c9cc;
  --name:"Alegreya",Georgia,serif;--ui:"Alegreya Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181f;--panel:#1b242d;--ink:#e9eef3;--muted:#9dabb8;--line:#33404c;--accent:#62b4d6;--accent-ink:#0b1a22;
  --good:#7fdba3;--good-bg:#17352a;--warn:#ecc867;--warn-bg:#3a3016;--need:#f2a29c;--need-bg:#402323;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181f;--panel:#1b242d;--ink:#e9eef3;--muted:#9dabb8;--line:#33404c;--accent:#62b4d6;--accent-ink:#0b1a22;
  --good:#7fdba3;--good-bg:#17352a;--warn:#ecc867;--warn-bg:#3a3016;--need:#f2a29c;--need-bg:#402323;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{display:grid;gap:8px;padding-block:10px}
.search{position:relative}
#q{width:100%;font:16px var(--ui);padding:11px 42px 11px 12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
#q:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#clear{position:absolute;right:4px;top:4px;bottom:4px;width:36px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.pips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters{display:grid;gap:8px;margin-bottom:10px}
.pip-btn{width:32px;height:32px;border-radius:50%;border:2px solid transparent;font:700 14px var(--ui);color:#17212c;cursor:pointer;opacity:.8}
.pip-btn[aria-pressed="true"]{opacity:1;border-color:var(--ink)}
.textopt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.selects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
select{min-width:0;width:100%;font:14px var(--ui);padding:7px 4px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
@media (max-width:520px){.selects{grid-template-columns:repeat(2,minmax(0,1fr))}}
main .wrap{padding-block:10px 32px}
#count{font-size:14px;color:var(--muted);margin:0 0 8px}
#list{display:grid;gap:6px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px}
summary{list-style:none;cursor:pointer;padding:9px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
summary::-webkit-details-marker{display:none}
.nm{font:700 17px/1.2 var(--name);min-width:0;overflow-wrap:anywhere}
.qty{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:1px;border:1px solid rgba(0,0,0,.25);vertical-align:-1px}
.tag{padding:0 6px;border-radius:5px;font-weight:700;font-size:13px}
.spare{color:var(--good);background:var(--good-bg)}.used{color:var(--warn);background:var(--warn-bg)}.need{color:var(--need);background:var(--need-bg)}
.more{padding:0 10px 10px;font-size:15px;display:grid;gap:5px;border-top:1px solid var(--line);padding-top:8px;margin:0 0 0}
.more p{margin:0;overflow-wrap:anywhere}.lbl{color:var(--muted)}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.empty b{font:700 18px var(--name);display:block;margin-bottom:2px}
#morebtn{width:100%;margin-top:8px;padding:11px;font:700 15px var(--ui);color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;cursor:pointer}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:52px;min-height:52px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pick input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.pick:has(input:checked){border-color:var(--accent);color:var(--accent)}
.thumb,.big{display:block;background-repeat:no-repeat;background-color:var(--line);border-radius:4px}
.big{border-radius:10px;max-width:100%;flex:none}
.nopic{background:var(--line)}
details summary{grid-template-columns:auto minmax(0,1fr) auto}
details summary:has(.thumb) .thumb{grid-row:1/3}
details summary:not(:has(.thumb)){grid-template-columns:minmax(0,1fr) auto}
details summary:not(:has(.thumb)) .sub{grid-column:1/-1}
details summary .sub{grid-column:2/-1}
.more{display:flex!important;flex-wrap:wrap;gap:10px;align-items:flex-start}
.more .txt{flex:1 1 200px;min-width:0;display:grid;gap:5px}
select.wide{grid-column:1/-1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.price{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
#bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
#bar b{font-variant-numeric:tabular-nums}
#bar button{margin-left:auto;padding:9px 14px;font:700 15px var(--ui);color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;cursor:pointer}
#bar .ghost{margin-left:0;background:none;color:var(--muted);border:1px solid var(--line)}
#picks{width:100%;font:14px/1.4 var(--ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
#date{font-size:13px;color:var(--muted);margin:12px 0 0}
</style>

  </div>
  <p id="count" aria-live="polite"></p>
  <div id="list"></div>
  <button id="morebtn" type="button" hidden>Show more</button>

</div></main>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
// row: [name, qtyForSale, sets, colors, typeLine, mv, thb, text]
const norm = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const cards = D.cards.map((r, i) => ({ id: i, name: r[0], qty: r[1], sets: r[2], colors: r[3], type: r[4], mv: r[5], thb: r[6], text: r[7], img: r[8], usd: r[9] || 0, roles: r[10] || '',
  n: norm(r[0]), squash: norm(r[0]).replace(/ /g, ''), t: norm(r[4] + ' ' + r[7]) }));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COL = { W: 'var(--w)', U: 'var(--u)', B: 'var(--b)', R: 'var(--r)', G: 'var(--g)', C: 'var(--c)' };
const chosen = new Set(), picked = new Map();
const pips = $('pips'), first = pips.firstChild;
for (const c of 'WUBRGC') {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'pip-btn'; b.textContent = c; b.style.background = COL[c];
  if (c === 'B') b.style.color = '#fff';
  b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green', C: 'Colorless' }[c]);
  b.onclick = () => { chosen.has(c) ? chosen.delete(c) : chosen.add(c); b.setAttribute('aria-pressed', chosen.has(c)); draw(); };
  pips.insertBefore(b, first);
}
for (const t of ['Creature', 'Planeswalker', 'Instant', 'Sorcery', 'Artifact', 'Enchantment', 'Land', 'Battle']) $('type').add(new Option(t, t));
{ const cnt = {}; for (const c of cards) for (const r of c.roles.split(';')) { const t = r.trim(); if (t) cnt[t] = (cnt[t] || 0) + 1; }
  for (const [t, n] of Object.entries(cnt).sort((a, b) => b[1] - a[1])) $('role').add(new Option(`${t} (${n})`, t)); }
let shown = 80, res = [];
const usd = n => '$' + n.toFixed(2);
// card pictures live in picture sheets (sale-img/sheet-NN.jpg); a card is one cell of a sheet
const IMG = D.img;
function pic(c, s, cls) {
  const p = c.img; const w = Math.round(IMG.w * s), h = Math.round(IMG.h * s);
  if (!p) return '';
  const f = 'sale-img/sheet-' + String(p[0]).padStart(2, '0') + '.jpg';
  return `<span class="${cls}" role="img" aria-label="${esc(c.name)}" style="width:${w}px;height:${h}px;background-image:url(${f});background-size:${IMG.w * IMG.cols * s}px auto;background-position:-${p[1] * IMG.w * s}px -${p[2] * IMG.h * s}px"></span>`;
}
function row(c) {
  const dots = (c.colors || 'C').split('').map(x => `<span class="dot" style="background:${COL[x] || COL.C}"></span>`).join('');
  return `<div class="row"><details><summary>${pic(c, 0.3, 'thumb')}<span class="nm">${esc(c.name)}</span><span class="qty">×${c.qty}</span>
    <span class="sub"><span>${dots}</span>${c.usd ? `<span class="price">${usd(c.usd)}</span>` : '<span>ask</span>'}${c.sets ? `<span>${esc(c.sets)}</span>` : ''}</span></summary>
    <div class="more">${pic(c, 1, 'big')}<div class="txt"><p><span class="lbl">${esc(c.type)}${c.mv !== '' ? ' · MV ' + c.mv : ''}</span></p>${c.text ? `<p>${esc(c.text)}</p>` : ''}${c.roles ? `<p class="lbl">${esc(c.roles)}</p>` : ''}</div></div></details>
    <label class="pick"><input type="checkbox" data-id="${c.id}" ${picked.has(c.id) ? 'checked' : ''}><span>Pick</span><span class="sr">${esc(c.name)}</span></label></div>`;
}
function draw(keep) {
  if (!keep) shown = 80;
  const qn = norm($('q').value), words = qn ? qn.split(' ') : [], sq = qn.replace(/ /g, ''), intext = $('intext').checked;
  const type = $('type').value, tier = $('tier').value, mv = $('mv').value, sort = $('sort').value, role = $('role').value;
  $('clear').hidden = !$('q').value;
  res = cards.filter(c => {
    if (words.length && !(words.every(w => c.n.includes(w)) || c.squash.includes(sq) || (intext && words.every(w => c.t.includes(w))))) return false;
    if (type && !c.type.includes(type)) return false;
    if (role && !c.roles.split(';').some(r => r.trim() === role)) return false;
    if (tier !== '') { const lo = +tier, hi = { 10: 1e9, 2: 10, 0.5: 2, 0: 0.5 }[tier]; if (c.usd < lo || c.usd >= hi) return false; }
    if (mv !== '' && (mv === '6' ? !(c.mv >= 6) : c.mv !== +mv)) return false;
    if (chosen.size) { const cs = c.colors ? c.colors.split('') : ['C']; if (!cs.every(x => chosen.has(x))) return false; }
    return true;
  });
  const by = { name: (a, b) => a.n.localeCompare(b.n), price: (a, b) => b.usd - a.usd || a.n.localeCompare(b.n), cheap: (a, b) => a.usd - b.usd || a.n.localeCompare(b.n), qty: (a, b) => b.qty - a.qty || a.n.localeCompare(b.n) }[sort];
  res.sort((a, b) => words.length ? ((b.squash === sq) - (a.squash === sq)) || ((b.n.startsWith(qn)) - (a.n.startsWith(qn))) || by(a, b) : by(a, b));
  const copies = res.reduce((s, c) => s + c.qty, 0);
  $('count').textContent = `${res.length.toLocaleString()} ${res.length === 1 ? 'card' : 'cards'} · ${copies.toLocaleString()} ${copies === 1 ? 'copy' : 'copies'} for sale`;
  $('list').innerHTML = res.length ? res.slice(0, shown).map(row).join('')
    : `<div class="empty"><b>${qn ? 'No “' + esc($('q').value.trim()) + '” for sale' : 'No cards match'}</b>Check the spelling, or clear the filters.</div>`;
  $('morebtn').hidden = res.length <= shown;
  $('morebtn').textContent = `Show more (${(res.length - shown).toLocaleString()} left)`;
}
function updateBar() {
  const items = [...picked.values()], n = items.length, total = items.reduce((s, c) => s + c.usd, 0);
  $('bar').hidden = !n; $('pn').textContent = n; $('pt').textContent = usd(total);
  $('picks').value = items.map(c => `1 ${c.name}${c.usd ? ' - ' + usd(c.usd) : ''}`).join('\n') + `\nTotal: ${usd(total)} (Card Kingdom)`;
}
$('list').addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.id; if (id === undefined) return;
  e.target.checked ? picked.set(+id, cards[+id]) : picked.delete(+id); updateBar();
});
$('copy').onclick = () => {
  const t = $('picks').value;
  const show = () => { $('picks').hidden = false; $('picks').select(); $('copy').textContent = 'Select and copy'; };
  try { navigator.clipboard.writeText(t).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy my list', 1500); }, show); } catch (e) { show(); }
};
$('reset').onclick = () => { picked.clear(); $('picks').hidden = true; updateBar(); draw(true); };
$('q').oninput = () => draw();
